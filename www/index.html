<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hava Kalitesi Radar Mobil</title>
    <meta name="theme-color" content="#0B1120">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #0B1120;
            color: #F8FAFC;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .app-shell {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0B1120;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1E293B;
            width: 100%;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .header-badge {
            background: #0284C7;
            color: white;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            min-width: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .header-text h1 {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
        }

        .header-text p {
            font-size: 11px;
            color: #38BDF8;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: #1E293B;
            border: 1px solid #334155;
            color: #38BDF8;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* STATS (3 Kutulu DepremAppMobile Standardı) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 16px 6px 16px;
            width: 100%;
        }

        .stat-card {
            background: #1E293B;
            border-radius: 10px;
            padding: 8px 6px;
            border: 1px solid #334155;
            text-align: center;
            min-width: 0;
        }

        .stat-title {
            font-size: 9px;
            color: #94A3B8;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 800;
            margin-top: 2px;
            white-space: nowrap;
        }

        /* FILTERS */
        .filter-section {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 12px;
            width: 100%;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #FFF;
            width: 100%;
            font-size: 13px;
            margin-left: 8px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group-title {
            font-size: 10px;
            color: #64748B;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .pill {
            padding: 5px 11px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            background: #1E293B;
            color: #94A3B8;
            border: 1px solid #334155;
            cursor: pointer;
            user-select: none;
            transition: 0.15s ease;
        }

        .pill.active {
            background: #0284C7;
            color: #FFF;
            border-color: #0284C7;
        }

        /* LIST OF CARDS */
        .eq-list {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .eq-card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            min-width: 0;
            cursor: pointer;
        }

        .eq-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .eq-badge {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
        }

        .eq-badge .mag {
            font-size: 17px;
            line-height: 1;
        }

        .eq-badge .type {
            font-size: 8px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-top: 2px;
        }

        .eq-info {
            flex: 1;
            min-width: 0;
        }

        .eq-location {
            font-size: 14px;
            font-weight: 700;
            color: #F8FAFC;
            line-height: 1.3;
        }

        .eq-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 11px;
            color: #94A3B8;
            flex-wrap: wrap;
        }

        .eq-country-tag {
            background: #334155;
            color: #38BDF8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .eq-details {
            display: none;
            padding-top: 8px;
            border-top: 1px dashed #334155;
            font-size: 12px;
            color: #CBD5E1;
            line-height: 1.5;
        }

        .eq-card.expanded .eq-details {
            display: block;
        }

        /* BOTTOM NAV */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 56px;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid #1E293B;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #64748B;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #38BDF8;
        }

        /* MAP VIEW */
        #map-view {
            display: none;
            position: fixed;
            top: 58px;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            z-index: 500;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container { background: #0B1120 !important; }

        /* PAGINATION */
        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 16px 14px 20px 14px;
            width: 100%;
        }

        .page-btn {
            min-width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #1E293B;
            color: #94A3B8;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .page-btn.active {
            background: #0284C7;
            color: #FFF;
            border-color: #0284C7;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- HEADER -->
        <header>
            <div class="header-title">
                <div class="header-badge">💨</div>
                <div class="header-text">
                    <h1>HAVA KALİTESİ RADAR</h1>
                    <p id="clock-display">TR: --:-- | UTC: --:--</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-refresh" onclick="renderAll()">🔄 Yenile</button>
            </div>
        </header>

        <!-- LIST VIEW -->
        <main id="list-view">
            <!-- 3 Stat Kutusu (DepremAppMobile Birebir) -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Toplam Ölçüm</div>
                    <div class="stat-val" id="statTotal" style="color: #38BDF8;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Temiz Hava (İyi)</div>
                    <div class="stat-val" id="statClean" style="color: #4ADE80;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Kirlilik Riski</div>
                    <div class="stat-val" id="statBad" style="color: #F87171;">0</div>
                </div>
            </div>

            <div class="filter-section">
                <!-- Arama -->
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="Şehir veya ülke ara (İstanbul, Ankara, Berlin)..." oninput="applyFilters()">
                </div>

                <!-- Kapsam (TR / Global) -->
                <div class="filter-group">
                    <div class="filter-wrap">
                        <div class="pill active" id="pill-tr" onclick="setScope('TR', this)">🇹🇷 Türkiye İstasyonları</div>
                        <div class="pill" id="pill-global" onclick="setScope('GLOBAL', this)">🌐 Dünya Metropolleri</div>
                    </div>
                </div>

                <!-- Zaman Aralığı (Genişletilmiş DepremAppMobile Tarihleri) -->
                <div class="filter-group">
                    <span class="filter-group-title">Tarih Aralığı:</span>
                    <div class="filter-wrap">
                        <div class="pill active" onclick="setTimeRange(1, this)">24 Saat</div>
                        <div class="pill" onclick="setTimeRange(3, this)">3 Gün</div>
                        <div class="pill" onclick="setTimeRange(7, this)">7 Gün</div>
                        <div class="pill" onclick="setTimeRange(15, this)">15 Gün</div>
                        <div class="pill" onclick="setTimeRange(30, this)">30 Gün</div>
                        <div class="pill" onclick="setTimeRange(90, this)">90 Gün</div>
                        <div class="pill" onclick="setTimeRange(365, this)">1 Sene</div>
                        <div class="pill" onclick="setTimeRange(1095, this)">3 Sene</div>
                        <div class="pill" onclick="setTimeRange(1825, this)">5 Sene</div>
                        <div class="pill" onclick="setTimeRange(3650, this)">10 Sene</div>
                    </div>
                        <div class="pill" onclick="setTimeRange(7, this)">7 Gün</div>
                        <div class="pill" onclick="setTimeRange(30, this)">30 Gün</div>
                        <div class="pill" onclick="setTimeRange(90, this)">90 Gün</div>
                        <div class="pill" onclick="setTimeRange(365, this)">1 Sene</div>
                        <div class="pill" onclick="setTimeRange(1095, this)">3 Sene</div>
                    </div>
                </div>
            </div>

            <!-- İstasyon Listesi -->
            <div class="eq-list" id="cardList"></div>

            <!-- Sayfalama -->
            <div class="pagination-container" id="pagination"></div>
        </main>

        <!-- MAP VIEW (Alt Menüden Geçiş Yapılan Tam Ekran Harita) -->
        <div id="map-view">
            <div id="map"></div>
        </div>

        <!-- BOTTOM NAV BAR (DepremAppMobile Birebir) -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="nav-list" onclick="switchTab('list')">
                <span style="font-size: 18px;">📋</span>
                <span>Liste</span>
            </div>
            <div class="nav-item" id="nav-map" onclick="switchTab('map')">
                <span style="font-size: 18px;">🗺️</span>
                <span>Harita</span>
            </div>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Çift Saat
        function updateClock() {
            const now = new Date();
            const tr = now.toLocaleTimeString('tr-TR', { timeZone: 'Europe/Istanbul' });
            const utc = now.toLocaleTimeString('en-GB', { timeZone: 'UTC' });
            document.getElementById('clock-display').textContent = `TR: ${tr} | UTC: ${utc}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const stations = [
            { id: 1, scope: 'TR', name: 'İstanbul / Kadıköy', lat: 40.9910, lon: 29.0250, aqi: 42, pm25: 10.2, pm10: 22.4, temp: 16, status: 'İyi', color: '#10B981' },
            { id: 2, scope: 'TR', name: 'İstanbul / Mecidiyeköy', lat: 41.0660, lon: 28.9930, aqi: 78, pm25: 25.4, pm10: 48.0, temp: 15, status: 'Orta', color: '#F59E0B' },
            { id: 3, scope: 'TR', name: 'Ankara / Kızılay', lat: 39.9208, lon: 32.8541, aqi: 65, pm25: 19.8, pm10: 38.5, temp: 12, status: 'Orta', color: '#F59E0B' },
            { id: 4, scope: 'TR', name: 'İzmir / Alsancak', lat: 38.4192, lon: 27.1287, aqi: 35, pm25: 8.4, pm10: 18.0, temp: 19, status: 'İyi', color: '#10B981' },
            { id: 5, scope: 'TR', name: 'Bursa / Nilüfer', lat: 40.2150, lon: 28.9800, aqi: 88, pm25: 29.2, pm10: 55.0, temp: 14, status: 'Orta', color: '#F59E0B' },
            { id: 6, scope: 'TR', name: 'Antalya / Muratpaşa', lat: 36.8841, lon: 30.7056, aqi: 24, pm25: 5.8, pm10: 14.2, temp: 22, status: 'İyi', color: '#10B981' },
            { id: 7, scope: 'TR', name: 'Kocaeli / Dilovası Sanayi', lat: 40.7850, lon: 29.5400, aqi: 142, pm25: 52.0, pm10: 92.0, temp: 15, status: 'Kritik', color: '#EF4444' },
            { id: 8, scope: 'TR', name: 'Trabzon / Sahil', lat: 41.0027, lon: 39.7168, aqi: 22, pm25: 5.1, pm10: 12.0, temp: 13, status: 'İyi', color: '#10B981' },
            { id: 101, scope: 'GLOBAL', name: 'Hindistan / Yeni Delhi', lat: 28.6139, lon: 77.2090, aqi: 280, pm25: 180.0, pm10: 300.0, temp: 24, status: 'Kritik', color: '#EF4444' },
            { id: 102, scope: 'GLOBAL', name: 'Çin / Pekin', lat: 39.9042, lon: 116.4074, aqi: 130, pm25: 47.0, pm10: 85.0, temp: 10, status: 'Kritik', color: '#EF4444' },
            { id: 103, scope: 'GLOBAL', name: 'İngiltere / Londra', lat: 51.5074, lon: -0.1278, aqi: 32, pm25: 7.5, pm10: 16.0, temp: 11, status: 'İyi', color: '#10B981' },
            { id: 104, scope: 'GLOBAL', name: 'Fransa / Paris', lat: 48.8566, lon: 2.3522, aqi: 44, pm25: 10.5, pm10: 20.0, temp: 13, status: 'İyi', color: '#10B981' },
            { id: 105, scope: 'GLOBAL', name: 'Almanya / Berlin', lat: 52.5200, lon: 13.4050, aqi: 38, pm25: 8.8, pm10: 18.0, temp: 9, status: 'İyi', color: '#10B981' },
            { id: 106, scope: 'GLOBAL', name: 'Japonya / Tokyo', lat: 35.6762, lon: 139.6503, aqi: 26, pm25: 6.2, pm10: 14.0, temp: 15, status: 'İyi', color: '#10B981' }
        ];

        let currentScope = 'TR';
        let currentDays = 1;
        let searchQuery = '';
        let currentPage = 1;
        const pageSize = 5;

        let map = null;
        let markerLayer = null;

        function setScope(scope, el) {
            document.querySelectorAll('#pill-tr, #pill-global').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentScope = scope;
            currentPage = 1;
            renderAll();
        }

        function setTimeRange(days, el) {
            el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentDays = days;
            renderAll();
        }

        function applyFilters() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            currentPage = 1;
            renderAll();
        }

        function getFiltered() {
            return stations.filter(s => {
                const matchScope = s.scope === currentScope;
                const matchSearch = searchQuery === '' || s.name.toLowerCase().includes(searchQuery);
                return matchScope && matchSearch;
            });
        }

        function renderAll() {
            const items = getFiltered();
            
            // 3 Stat Kutusu Güncellemesi
            document.getElementById('statTotal').textContent = items.length;
            document.getElementById('statClean').textContent = items.filter(s => s.aqi <= 50).length;
            document.getElementById('statBad').textContent = items.filter(s => s.aqi > 100).length;

            // Sayfalama
            const totalPages = Math.ceil(items.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * pageSize;
            const pageItems = items.slice(start, start + pageSize);

            const container = document.getElementById('cardList');
            container.innerHTML = '';

            pageItems.forEach(st => {
                const card = document.createElement('div');
                card.className = 'eq-card';
                card.innerHTML = `
                    <div class="eq-card-header">
                        <div class="eq-badge" style="background: ${st.color};">
                            <span class="mag">${st.aqi}</span>
                            <span class="type">AQI</span>
                        </div>
                        <div class="eq-info">
                            <div class="eq-location">${st.name}</div>
                            <div class="eq-sub">
                                <span class="eq-country-tag">${st.status}</span>
                                <span>PM2.5: ${st.pm25} µg/m³</span>
                                <span>• ${st.temp} °C</span>
                            </div>
                        </div>
                    </div>
                    <div class="eq-details">
                        <div>PM10 Toz Seviyesi: <strong>${st.pm10} µg/m³</strong></div>
                        <div>Koordinat: <strong>${st.lat}, ${st.lon}</strong></div>
                        <div>Dönem Arşivi: <strong>${currentDays === 1 ? 'Anlık / 24 Saat' : currentDays + ' Günlük Analiz'}</strong></div>
                    </div>
                `;
                card.onclick = () => card.classList.toggle('expanded');
                container.appendChild(card);
            });

            renderPagination(totalPages);
            updateMapMarkers(items);
        }

        function renderPagination(totalPages) {
            const pDiv = document.getElementById('pagination');
            pDiv.innerHTML = '';
            if (totalPages <= 1) return;

            const prev = document.createElement('div');
            prev.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prev.textContent = '◀';
            prev.onclick = () => { if (currentPage > 1) { currentPage--; renderAll(); } };
            pDiv.appendChild(prev);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; renderAll(); };
                pDiv.appendChild(btn);
            }

            const next = document.createElement('div');
            next.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
            next.textContent = '▶';
            next.onclick = () => { if (currentPage < totalPages) { currentPage++; renderAll(); } };
            pDiv.appendChild(next);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (tab === 'list') {
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('map-view').style.display = 'none';
            } else {
                document.getElementById('nav-map').classList.add('active');
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('map-view').style.display = 'block';
                initMap();
                setTimeout(() => map.invalidateSize(), 150);
            }
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { attributionControl: false }).setView([39.0, 35.0], 5);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
            markerLayer = L.layerGroup().addTo(map);
            updateMapMarkers(getFiltered());
        }

        function updateMapMarkers(items) {
            if (!markerLayer) return;
            markerLayer.clearLayers();
            items.forEach(st => {
                const c = L.circleMarker([st.lat, st.lon], {
                    radius: 8,
                    fillColor: st.color,
                    color: '#fff',
                    weight: 1.5,
                    fillOpacity: 0.9
                }).bindPopup(`<strong>${st.name}</strong><br>AQI: ${st.aqi} (${st.status})`);
                markerLayer.addLayer(c);
            });
        }

        window.onload = () => renderAll();
    </script>
</body>
</html>
